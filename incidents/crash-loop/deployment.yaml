apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubedoctor-crash-test
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kubedoctor-crash-test
  template:
    metadata:
      labels:
        app: kubedoctor-crash-test
    spec:
      containers:
        - name: crash-test
          image: busybox:1.36
          command: ["sh", "-c"]
          args:
            - |
              echo "KubeDoctor crash test started"
              echo "Simulating application failure..."
              exit 1
