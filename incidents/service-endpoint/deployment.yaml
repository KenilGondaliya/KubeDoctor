apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubedoctor-endpoint-test
spec:
  replicas: 1
  selector:
    matchLabels:
      app: actual-label
  template:
    metadata:
      labels:
        app: actual-label
    spec:
      containers:
        - name: web
          image: nginx:1.27
---
apiVersion: v1
kind: Service
metadata:
  name: kubedoctor-endpoint-test
spec:
  selector:
    app: wrong-label
  ports:
    - port: 80
      targetPort: 80
