services:

  postgres:
    image: postgres:17
    container_name: kubedoctor-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: kubedoctor
      POSTGRES_PASSWORD: kubedoctor
      POSTGRES_DB: kubedoctor
    ports:
      - "5432:5432"
    volumes:
      - kubedoctor_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kubedoctor -d kubedoctor"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    container_name: kubedoctor-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - kubedoctor_redis_data:/data

  nats:
    image: nats:2.11-alpine
    container_name: kubedoctor-nats
    restart: unless-stopped
    command:
      - "-js"
      - "-m"
      - "8222"
    ports:
      - "4222:4222"
      - "8222:8222"

volumes:
  kubedoctor_postgres_data:
  kubedoctor_redis_data: